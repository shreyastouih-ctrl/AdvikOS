name: Build AdvikOS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AdvikOS Bootable ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Windows Line Endings (CRLF to LF)
        run: |
          find . -type f \( -name "*.sh" -o -name "*.chroot" -o -name "*.xml" -o -name "packages.*" -o -name "*.conf" -o -name "advik-*" \) -exec sed -i 's/\r$//' {} +

      - name: Build ISO in Arch Linux Container
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/advikos" \
            archlinux:latest \
            bash -c "
              set -e
              echo '>> Setting up Arch mirrors...'
              echo 'Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch' > /etc/pacman.d/mirrorlist
              
              echo '>> Enabling multilib and chaotic-aur...'
              printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
              printf '\n[chaotic-aur]\nSigLevel = Never\nServer = https://geo-mirror.chaotic.cx/\$repo/\$arch\nServer = https://cdn-mirror.chaotic.cx/\$repo/\$arch\n' >> /etc/pacman.conf

              
              echo '>> Initializing keyring and installing archiso...'
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archiso dos2unix
              
              echo '>> Sanitizing line endings...'
              cd /advikos
              find . -type f -exec dos2unix -q {} + 2>/dev/null || true
              
              echo '>> Compiling AdvikOS bootable ISO...'
              mkdir -p /advikos/out
              mkarchiso -v -w /tmp/archiso-work -o /advikos/out .
            "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdvikOS-Bootable-ISO
          path: out/*.iso
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: AdvikOS v1.0.0 (1GB RAM Edition)
          body: |
            ## AdvikOS 🎮 (1GB RAM Gaming & Android OS)
            - 🍷 Windows Software / Wine support
            - 🤖 Waydroid Android Container
            - 🕹️ RetroArch Emulation
            - 🌐 Falkon Web Browser
            - ⚡ ZRAM Memory Multiplier (1GB -> ~2.4GB usable RAM)
            - 💾 Windows NTFS Reader/Writer
          files: out/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
